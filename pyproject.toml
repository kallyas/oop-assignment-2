[project]
name = "oop-assignment-2"
version = "1.0.0"
description = "OOP with Python, Assignment 2: weather forecast client and Uganda tax engine"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src", "tests"]
